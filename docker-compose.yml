version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: pasarela-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  vault:
    image: hashicorp/vault:1.15
    container_name: pasarela-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "my-safe-vault-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    restart: always

  kong:
    image: kong:3.6-alpine
    container_name: pasarela-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/usr/local/kong/declarative/kong.yml"
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl http2"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_LOG_LEVEL: "info"
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
    volumes:
      - ./kong/kong.yml:/usr/local/kong/declarative/kong.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

volumes:
  redis_data:
